<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Launch Pad · AI updates</title>
  <link rel="icon" href="/assets/icons/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/launch/assets/launch.css?v=37">
</head>
<body class="locked">
  <main>
    <section class="panel ai-hero" aria-labelledby="aiTitle">
      <div class="ai-hero-text">
        <p class="ai-eyebrow">From your RedNote likes &amp; collections</p>
        <h2 id="aiTitle">AI updates</h2>
        <p class="ai-sub" id="aiSub">Skills, tools and resources you saved. Claude checks for new ones every day.</p>
      </div>
      <div class="ai-stats" id="aiStats" aria-live="polite"></div>
    </section>

    <div id="aiBanner"></div>

    <div class="board-bar ai-bar">
      <input type="search" id="aiQ" placeholder="Search tools, notes, tags" aria-label="Search tools">
      <div class="legend" id="aiKinds" role="group" aria-label="Filter by kind"></div>
      <span class="spacer"></span>
      <button type="button" class="btn small ghost" id="aiShowHidden" aria-pressed="false">Show hidden</button>
    </div>

    <div id="aiList" class="ai-list"><p class="empty">Loading your AI updates…</p></div>


    <p class="ai-foot" id="aiFoot"></p>
  </main>

  <script src="/launch/assets/config.js?v=36"></script>
  <script src="/launch/assets/launch.js?v=38"></script>
  <script src="/launch/assets/ai.js?v=36"></script>
</body>
</html>
