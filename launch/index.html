<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Launch Pad · Today</title>
  <link rel="icon" href="/assets/icons/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/launch/assets/launch.css?v=14">
</head>
<body class="locked">
  <main>
    <div class="home">
      <div class="home-main">
        <section class="panel music" aria-labelledby="musicH">
          <div class="panel-head">
            <h2 id="musicH">Focus music</h2>
            <div class="music-tools">
              <span class="timer" title="Focus timer">
                <b id="timerTime">50:00</b>
                <select id="timerLen" aria-label="Block length"><option value="25">25 min</option><option value="50" selected>50 min</option><option value="90">90 min</option></select>
                <button type="button" class="btn small" id="timerGo">Start</button>
                <button type="button" class="btn small ghost" id="timerReset" hidden>Reset</button>
              </span>
              <button type="button" class="btn small ghost" id="musicPop">Pop out <span id="popIcon"></span></button>
            </div>
          </div>
          <div id="musicSlot"></div>
          <p class="frame-note">Keeps playing while you switch tabs. If Brain.fm asks you to sign in here, sign in once; if it won’t play, use Pop out. Focus time counts while the timer runs.</p>
        </section>

        <section class="panel" aria-labelledby="focusH">
          <div class="panel-head">
            <h2 id="focusH">Concentration</h2>
            <button type="button" class="btn small ghost" id="focusAdd">+ Add time</button>
          </div>
          <div class="panel-body focus-sum">
            <div class="fstats" id="focusStats"></div>
            <div class="fbars" id="focusBars" aria-label="Focus time, last 14 days"></div>
          </div>
        </section>

        <section class="panel" aria-labelledby="dueH">
          <div class="panel-head">
            <h2 id="dueH">Coming up</h2>
            <a class="btn small ghost" href="/launch/task-list/">All tasks</a>
          </div>
          <div class="panel-body due-cols"><div><h3 id="dueMiscH">To do: Miscellaneous</h3><ul class="due-list" id="dueMisc"></ul></div><div><h3 id="dueResH">To do: Research</h3><ul class="due-list" id="dueRes"></ul></div></div>
        </section>
      </div>

      <aside class="home-side">
        <section class="panel agenda" aria-labelledby="agendaH">
          <div class="panel-head">
            <h2 id="agendaH" class="sr">Agenda</h2>
            <div class="agenda-nav">
              <button type="button" class="icon-btn" id="agPrev" aria-label="Previous day">‹</button>
              <strong id="agDate"></strong>
              <button type="button" class="icon-btn" id="agNext" aria-label="Next day">›</button>
            </div>
            <a class="btn small ghost" href="/launch/calendar/">Week</a>
          </div>
          <div id="agendaBanner"></div>
          <div id="agendaView"></div>
          <div id="agendaMonth" style="border-top:1px solid var(--line-2)"></div>
        </section>
      </aside>
    </div>
  </main>

  <script src="/launch/assets/config.js?v=14"></script>
  <script src="/launch/assets/launch.js?v=14"></script>
  <script src="/launch/assets/gcal.js?v=14"></script>
  <script src="/launch/assets/home.js?v=14"></script>
</body>
</html>
