<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="../assets/icons/favicon.png" type="image/x-icon">
    <title>Ranran Postdoc Meeting Agenda | Ranran Li</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="../custom_css/style.css?v=20260831-postdoc">
</head>
<body class="bg collaborator-page">
    <div id="particles-bg"></div>

    <nav class="sticky top-0 bg-gray-900 mx-auto z-50 shadow-lg py-1 max-w-screen-lg">
        <div class="container mx-auto px-4">
            <div class="flex justify-center">
                <a href="../index.html#Home" class="flex flex-col items-center py-2 px-2 mx-1 text-center">
                    <span class="font-semibold tracking-wide hover:text-green-600 text-gray-100 text-lg">
                        Ranran Postdoc Meeting Agenda
                    </span>
                    <span class="mt-1 text-xs tracking-widest text-gray-400">
                        Ranran Li
                    </span>
                </a>
            </div>
        </div>
    </nav>

    <main class="min-h-screen max-w-screen-xl mx-auto px-4 py-10">
        <section id="postdoc-meetings-lock" class="collaborator-lock" aria-labelledby="postdoc-meetings-lock-title">
            <div class="collaborator-lock-panel postdoc-meetings-lock-panel">
                <p class="collaborator-eyebrow postdoc-meetings-eyebrow">Private research workspace</p>
                <h1 id="postdoc-meetings-lock-title">Ranran Postdoc Meeting Agenda</h1>
                <p class="collaborator-lock-copy">
                    Enter the password to view the workspace.
                </p>

                <form id="postdoc-meetings-password-form" class="collaborator-password-form">
                    <label for="postdoc-meetings-password">Password</label>
                    <div class="collaborator-password-row">
                        <input id="postdoc-meetings-password" name="password" type="password" autocomplete="current-password" required>
                        <button type="submit">Enter</button>
                    </div>
                    <p id="postdoc-meetings-password-message" class="collaborator-password-message" role="status" aria-live="polite"></p>
                </form>
            </div>
        </section>

        <section id="postdoc-meetings-content" class="collaborator-content postdoc-meetings-content is-hidden" aria-labelledby="postdoc-meetings-title">
            <div class="postdoc-doc-panel">
                <div class="postdoc-doc-header">
                    <div>
                        <p class="collaborator-eyebrow postdoc-meetings-eyebrow">Private research workspace</p>
                        <h1 id="postdoc-meetings-title">Ranran Postdoc Meeting Agenda</h1>
                    </div>
                    <a class="postdoc-doc-open-link" href="https://docs.google.com/document/d/1LZ-q9ZLv7u-ZijjI1MPkAXseYnr60ikgJuOQXKgxBTw/edit?usp=sharing" target="_blank" rel="noopener noreferrer">
                        Open in Google Docs
                    </a>
                </div>
                <iframe
                    class="postdoc-doc-frame"
                    src="https://docs.google.com/document/d/1LZ-q9ZLv7u-ZijjI1MPkAXseYnr60ikgJuOQXKgxBTw/preview"
                    title="Ranran postdoc meeting agenda document preview"
                    loading="lazy">
                </iframe>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="../script/particles.js"></script>
    <script src="../script/postdoc-meetings.js?v=20260831"></script>
</body>
</html>
