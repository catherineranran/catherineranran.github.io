<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="description" content="View the AI-generated Bystander video in an interactive 140-degree magic window on your screen, opened with the study password.">
    <title>Generated · Magic window · Bystander | Scalable Immersion</title>
    <link rel="icon" href="/assets/icons/favicon.png" type="image/png">
    <link rel="stylesheet" href="session.css?v=20261012-140">
</head>
<body>
    <main id="study-session">
        <section class="access" id="access" aria-labelledby="access-title">
            <form class="panel" id="gate" autocomplete="on">
                <p class="eyebrow">Scalable Immersion</p>
                <h1 id="access-title">Study access</h1>
                <p class="lead" id="access-lead">Enter the password to open this viewing session.</p>
                <input type="text" name="username" value="study" autocomplete="username" hidden>
                <label for="pw">Password</label>
                <div class="row">
                    <input type="password" id="pw" name="password" autocomplete="current-password" required>
                    <button type="submit" id="open">Open session</button>
                </div>
                <p class="status" id="status" role="status" aria-live="polite"></p>
                <p class="help">AI-generated Bystander scenario, 95–185 s (89 s), made with Seedance 2.5, shown as a 140° magic window.</p>
                <p class="back"><a href="/projects/scalable-immersion-videos/" target="_top">All scenarios</a></p>
            </form>
        </section>
        <section class="stage" id="stage" aria-label="Video player: drag or use the arrow keys to look around" hidden>
            <div class="view" id="view">
                <canvas id="canvas" aria-label="Magic window: drag to look around"></canvas>
                <div class="overlay" id="overlay" hidden><button type="button" id="overlay-btn">Play</button></div>
                <div class="msg" id="msg" role="status" hidden></div>
            </div>
            <div class="controls">
                <button type="button" id="play">Play</button>
                <button type="button" id="restart">From the start</button>
                <button type="button" id="mute">Mute</button>
                <button type="button" id="centre">Look ahead</button>
                <span class="time" id="time">0:00 / 0:00</span>
                <span class="track" aria-hidden="true"><span id="progress"></span></span>
                <span class="hint">Drag or arrow keys: look around · Space: play or pause</span>
            </div>
        </section>
        <noscript><p class="fallback">Enable JavaScript to open this study session.</p></noscript>
    </main>
    <script>window.SI_DELIVERY = 'screen';</script>
    <script type="module" src="player.js?v=20261012-140"></script>
</body>
</html>
