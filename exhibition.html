    <script>
        // Lays out the posts. Runs once they are unlocked (script/exhibition-lock.js calls it).
        window.initExhibitionBoard = function () {
            (function () {
                var board = document.querySelector('.exhibition-board');
                var hint = document.querySelector('.exhibition-scroll-hint');
                function updateHint() {
                    hint.textContent = board.scrollWidth > board.clientWidth + 1
                        ? 'Scroll horizontally through the columns and vertically within each column.'
                        : 'Scroll vertically within each column.';
                }
                updateHint();
                window.addEventListener('resize', updateHint);
            })();

            // The two-column card feed ([data-masonry]): newest card top-left, the next
            // top-right, and each later card goes into whichever column is shorter.
            // Narrow screens get one column. Without this script the cards sit in
            // plain rows of two, still newest first.
            (function () {
                var feed = document.querySelector('[data-masonry]');
                if (!feed || !('ResizeObserver' in window)) return;
                var GAP = 12, MIN_CARD = 152;

                // newest first, by each card's date; a card without one keeps its place
                var cards = Array.prototype.filter.call(feed.children, function (el) { return el.tagName === 'ARTICLE'; });
                var last = Infinity;
                cards.map(function (card, i) {
                    var t = card.querySelector('time[datetime], .exhibition-sticker-date');
                    var key = t ? Date.parse(t.getAttribute('datetime') || '') : NaN;
                    if (isNaN(key) && t) {
                        var m = /(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(t.textContent);
                        if (m) key = Date.UTC(+m[3], +m[2] - 1, +m[1]);
                    }
                    if (isNaN(key)) key = last;
                    last = key;
                    return { card: card, key: key, i: i };
                }).sort(function (a, b) { return (b.key - a.key) || (a.i - b.i); })
                  .forEach(function (o) { feed.appendChild(o.card); });
                cards = Array.prototype.slice.call(feed.children);

                function layout() {
                    var width = feed.clientWidth;
                    if (!width) return;
                    var n = Math.max(1, Math.min(2, Math.floor((width + GAP) / (MIN_CARD + GAP))));
                    var colW = (width - GAP * (n - 1)) / n;
                    var heights = [];
                    for (var k = 0; k < n; k++) heights.push(0);
                    cards.forEach(function (card) {
                        card.style.width = colW + 'px';
                        var col = 0;
                        for (var k = 1; k < n; k++) if (heights[k] < heights[col]) col = k;
                        card.style.left = (col * (colW + GAP)) + 'px';
                        card.style.top = heights[col] + 'px';
                        heights[col] += card.offsetHeight + GAP;
                    });
                    feed.style.height = Math.max(0, Math.max.apply(null, heights) - GAP) + 'px';
                }

                var queued = false;
                function schedule() {
                    if (queued) return;
                    queued = true;
                    requestAnimationFrame(function () { queued = false; layout(); });
                }

                feed.classList.add('is-masonry');
                layout();
                var watcher = new ResizeObserver(schedule);
                watcher.observe(feed);
                cards.forEach(function (card) { watcher.observe(card); });
                if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
            })();

            document.querySelectorAll('[data-video]').forEach(function (wrap) {
                var video = wrap.querySelector('video');
                var button = wrap.querySelector('.exhibition-video-play');
                button.addEventListener('click', function () {
                    wrap.classList.add('is-playing');
                    video.controls = true;
                    video.play();
                });
            });
        };
    </script>
