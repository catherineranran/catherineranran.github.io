<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" role="img" aria-labelledby="title desc">
  <title id="title">Governing the Commons</title>
  <desc id="desc">A custom cover treatment for Elinor Ostrom's Governing the Commons</desc>
